name: Build Dopamine Rootless DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install signing tool
        shell: bash
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list xz >/dev/null 2>&1 || brew install xz

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$sdk_archive" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$HOME/theos/sdks"
          tar -xJf "$sdk_archive" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          "$THEOS/bin/logos.pl" --version || true
          command -v clang
          command -v ldid
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build Dopamine rootless package
        shell: bash
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 STRIP=0 2>&1 | tee build-tgextra-rootless.log

      - name: Verify package
        shell: bash
        run: |
          set -e
          DEB="$(find packages -maxdepth 1 -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          file "$DEB"
          ar -t "$DEB"
          shasum -a 256 "$DEB" | tee package-sha256.txt

      - name: Upload DEB and build log
        uses: actions/upload-artifact@v7
        with:
          name: TGExtra-Dopamine-rootless
          if-no-files-found: error
          path: |
            packages/*_iphoneos-arm64.deb
            build-tgextra-rootless.log
            package-sha256.txt
