name: Build Dopamine Rootless DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Theos and iOS SDK
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build Dopamine rootless package
        shell: bash
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 STRIP=0 2>&1 | tee build-tgextra-rootless.log

      - name: Verify package
        shell: bash
        run: |
          set -e
          DEB="$(find packages -maxdepth 1 -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          shasum -a 256 "$DEB" | tee package-sha256.txt
          file .theos/obj/TGExtra.dylib || true

      - name: Upload DEB and build log
        uses: actions/upload-artifact@v4
        with:
          name: TGExtra-Dopamine-rootless
          if-no-files-found: error
          path: |
            packages/*_iphoneos-arm64.deb
            build-tgextra-rootless.log
            package-sha256.txt
